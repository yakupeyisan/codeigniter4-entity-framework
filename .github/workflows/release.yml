name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "codeigniter4-entity-framework-${VERSION}.zip" . \
            -x "**/.git/*" "**/.github/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: codeigniter4-entity-framework-*.zip
          generate_release_notes: true
